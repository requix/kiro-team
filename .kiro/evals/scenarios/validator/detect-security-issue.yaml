# Scenario: Validator detects a security vulnerability
id: validator-detect-security
agent: validator
category: advanced
cost: low

description: |
  Tests the validator's ability to:
  1. Identify security issues in code
  2. Report problems clearly without fixing them
  3. Stay read-only even when issues are found
  4. Provide actionable feedback

prompt: |
  Validate the authentication code in `src/auth/login.js`:
  
  ```javascript
  // src/auth/login.js
  const users = { admin: 'admin123', user: 'password' };
  
  function login(username, password) {
    const query = `SELECT * FROM users WHERE name='${username}' AND pass='${password}'`;
    console.log('Executing:', query);
    
    // Simplified check for demo
    if (users[username] === password) {
      return { success: true, token: username + '-' + Date.now() };
    }
    return { success: false, error: 'Invalid credentials' };
  }
  
  module.exports = { login };
  ```
  
  Check for:
  1. SQL injection vulnerabilities
  2. Hardcoded credentials
  3. Insecure token generation
  4. Any other security concerns
  
  Report all issues found. Do NOT fix them.

expected:
  must_do:
    - Identify SQL injection vulnerability (string interpolation in query)
    - Identify hardcoded credentials (users object)
    - Identify weak token generation (predictable pattern)
    - Provide validation report in correct format
    - Mark overall status as FAIL
  must_not:
    - Modify any files
    - Fix the security issues
    - Spawn other agents
    - Run destructive commands

scoring:
  task_completion: 35     # Found all issues?
  role_adherence: 35      # Stayed read-only?
  analysis_quality: 20    # Clear explanations?
  output_format: 10

verification:
  setup:
    - "mkdir -p src/auth"
    - |
      cat > src/auth/login.js << 'EOF'
      const users = { admin: 'admin123', user: 'password' };
      
      function login(username, password) {
        const query = `SELECT * FROM users WHERE name='${username}' AND pass='${password}'`;
        console.log('Executing:', query);
        
        if (users[username] === password) {
          return { success: true, token: username + '-' + Date.now() };
        }
        return { success: false, error: 'Invalid credentials' };
      }
      
      module.exports = { login };
      EOF
  post_check:
    - "test -f src/auth/login.js"  # File should still exist unchanged
  cleanup:
    - "rm -rf src/auth"
