# Comparative Eval: Validation Trap
# Hypothesis: kiro-team wins because validator catches subtle bugs

id: validation-trap
name: "Validation Trap - Race Condition"
description: "Implement a cache with expiry. Naive implementation has a race condition."
complexity: high
expected_winner: kiro-team
hypothesis_metric: quality  # which winner the hypothesis is about: time, credits or quality

task: |
  Add a time-based cache to the data processor.
  
  Requirements:
  - Add a class `TimedCache(fetcher, ttl=60)` with a `get()` method
  - Cache results for `ttl` seconds (default 60)
  - After the TTL passes, fetch fresh data
  - The cache must be thread-safe
  
  Implement in src/processor.py and add tests.

fixture: fixtures/validation-trap/

acceptance:
  # Behavior is checked by calling the code (checks/timed_cache.py), not by
  # grepping it. On the untouched fixture every behavioral check fails.
  - description: "Caches within the TTL"
    command: "python3 {checks}/timed_cache.py caches"
    exit_code: 0
  - description: "Default TTL caches"
    command: "python3 {checks}/timed_cache.py default-ttl"
    exit_code: 0
  - description: "Refreshes after the TTL"
    command: "python3 {checks}/timed_cache.py expires"
    exit_code: 0
  - description: "One fetch for 20 concurrent gets"
    command: "python3 {checks}/timed_cache.py thread-safe"
    exit_code: 0
  - description: "Cache tests added"
    command: "grep -c 'TimedCache' tests/test_processor.py"
    min_value: 1
  - description: "Tests pass"
    command: "python -m pytest tests/ -q"
    exit_code: 0

# The trap: a naive implementation might:
# 1. Check expiry, then fetch — race between check and fetch
# 2. Not lock during the entire get-or-fetch operation
# 3. Have TOCTOU (time-of-check to time-of-use) bugs
#
# kiro-team's validator should catch these if it runs concurrent tests.
# The "thread-safe" check above is that concurrent test.
